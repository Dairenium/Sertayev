name: Matrix Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check Node version
        run: node -v

      - name: System info
        run: echo "OS: ${{ runner.os }}; Arch: ${{ runner.arch }}"