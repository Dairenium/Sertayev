name: PR Check

on:
  pull_request:
    branches: [ main ]

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README.md
        run: test -f README.md

      - name: Failure message
        if: failure()
        run: echo "Ошибка: проверка не пройдена. README.md отсутствует или предыдущий шаг упал."