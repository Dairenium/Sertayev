name: System Info

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: OS info
        run: |
          uname -a
          cat /etc/os-release

      - name: User and directory
        run: |
          whoami
          pwd

      - name: GitHub context
        run: |
          echo "Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"